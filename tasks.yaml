apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npm
  description: Installs project dependencies using npm in the workspace
spec:
  workspaces:
    - name: source
      description: The workspace containing the cloned source code
  steps:
    - name: npm-install
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -e
        echo "=== Installing npm dependencies ==="
        npm ci || npm install
        echo "=== Dependencies installed successfully ==="
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: Jasmine
  description: Executes Jasmine unit test specifications
spec:
  workspaces:
    - name: source
      description: The workspace containing the project code and tests
  steps:
    - name: run-jasmine-tests
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -e
        echo "=== Running Jasmine unit test suite ==="
        npx jasmine
        echo "=== All Jasmine tests passed successfully ==="
